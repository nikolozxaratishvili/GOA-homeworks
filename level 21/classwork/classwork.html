<html>
<head>
    <title>რეგისტრაცია</title>
</head>
<body>

    <h1>რეგისტრაციის ფორმა</h1>

    <form>

        <label for="name">სახელი:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="surname">გვარი:</label><br>
        <input type="text" id="surname" name="surname"><br><br>

        <label for="age">ასაკი:</label><br>
        <input type="number" id="age" name="age"><br><br>

        <p>აირჩიე ძაღლის ჯიში:</p>

        <input type="radio" id="bulldog" name="dog">
        <label for="bulldog">Bulldog</label><br>

        <input type="radio" id="labrador" name="dog">
        <label for="labrador">Labrador</label><br>

        <input type="radio" id="poodle" name="dog">
        <label for="poodle">Poodle</label><br>

        <input type="radio" id="husky" name="dog">
        <label for="husky">Husky</label><br><br>
   
        <label for="movie">აირჩიე საყვარელი ფილმი:</label>
        <select id="movie" name="movie">
        <option value="harry_potter">Harry Potter</option>
        <option value="spiderman">Spider-Man</option>
        <option value="fast_furious">Fast & Furious</option>
        <option value="avengers">Avengers</option>
        </select><br><br>

        <input type="submit" value="გაგზავნა">
    </form>

</body>
</html>
